name: Build APK - 小学コレシリーズ

on:
  workflow_dispatch:  # 手動トリガーのみ（自動ビルド無効化）

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - eigo-kore
      max-parallel: 1  # 単一ビルド（large checkout問題回避）

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🎯 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'

      - name: 📦 Get dependencies (${{ matrix.app }})
        run: |
          cd ${{ matrix.app }}
          flutter pub get

      - name: 🔨 Build APK (${{ matrix.app }})
        run: |
          cd ${{ matrix.app }}
          flutter build apk --release --android-skip-build-dependency-validation

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}/build/app/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: 📊 Build summary
        run: |
          echo "✅ ${{ matrix.app }} ビルド完了"
          ls -lh ${{ matrix.app }}/build/app/outputs/apk/release/ || echo "APK not found"

  summary:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: 📋 Build Results
        run: |
          echo "=== ビルド完了報告 ==="
          echo "✅ 全アプリビルド処理完了"
          echo ""
          echo "📦 成果物:"
          echo "  - artifacts タブからダウンロード可能"
          echo "  - 各アプリの APK ファイル"
