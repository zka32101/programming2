name: color_sort CI

on:
  push:
    paths: ['games/color_sort/**', 'puzzle_core/**', '.github/workflows/color-sort-ci.yml']
  pull_request:
    paths: ['games/color_sort/**', 'puzzle_core/**', '.github/workflows/color-sort-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/color_sort
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart run tool/check_levels.dart
      - run: dart test
