name: Populate Secret Manager Secrets

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm secret population'
        required: true
        default: ''

env:
  GCP_PROJECT: shougakukore

jobs:
  populate-secrets:
    name: Populate Secrets to GCP Secret Manager
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1234567890/locations/global/workloadIdentityPools/github-actions/providers/github-provider'
          service_account: 'kokugo-kore-ci-bot@shougakukore.iam.gserviceaccount.com'
          token_format: 'access_token'
          access_token_lifetime: '600s'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "yes" ]; then
            echo "❌ Confirmation required: please type 'yes' in the input"
            exit 1
          fi
          echo "✓ Confirmed: proceeding with secret population"

      - name: Populate secrets
        run: |
          echo "🔐 Populating kokugo-kore secrets..."

          # Android Keystore Password
          echo -n "M=M?hYZ34TEOC=OPW0W1sN-t1?Sk" | gcloud secrets versions add kokugo-kore-android-keystore-password --data-file=- --project=$GCP_PROJECT
          echo "✓ kokugo-kore-android-keystore-password"

          # Android Key Password
          echo -n "&ibN*oPn23NL_k=bN{ir5Ok{EsOr" | gcloud secrets versions add kokugo-kore-android-key-password --data-file=- --project=$GCP_PROJECT
          echo "✓ kokugo-kore-android-key-password"

          # RevenueCat API Key
          echo -n "goog_ohLibEJjzvECGlDDYBLicMfaLjI" | gcloud secrets versions add kokugo-kore-revenuecat-api-key --data-file=- --project=$GCP_PROJECT
          echo "✓ kokugo-kore-revenuecat-api-key"

          # AdMob App ID
          echo -n "ca-app-pub-5058227312086483" | gcloud secrets versions add kokugo-kore-admob-app-id --data-file=- --project=$GCP_PROJECT
          echo "✓ kokugo-kore-admob-app-id"

          # AdMob Banner Ad Unit ID
          echo -n "ca-app-pub-5058227312086483/3634526585" | gcloud secrets versions add kokugo-kore-admob-banner-ad-unit-id --data-file=- --project=$GCP_PROJECT
          echo "✓ kokugo-kore-admob-banner-ad-unit-id"

          # AdMob Interstitial Ad Unit ID
          echo -n "ca-app-pub-5058227312086483/9984312519" | gcloud secrets versions add kokugo-kore-admob-interstitial-ad-unit-id --data-file=- --project=$GCP_PROJECT
          echo "✓ kokugo-kore-admob-interstitial-ad-unit-id"

      - name: Populate binary secrets (Keystore & Service Account)
        env:
          KEYSTORE_BASE64_SECRET: ${{ secrets.KEYSTORE_BASE64_SECRET }}
          PLAY_CONSOLE_SA_KEY_BASE64: ${{ secrets.PLAY_CONSOLE_SA_KEY_BASE64 }}
        run: |
          # Decode and upload keystore
          if [ ! -z "$KEYSTORE_BASE64_SECRET" ]; then
            echo "$KEYSTORE_BASE64_SECRET" | base64 -d > /tmp/release_new.jks
            gcloud secrets versions add kokugo-kore-android-keystore-base64 \
              --data-file=/tmp/release_new.jks \
              --project=$GCP_PROJECT
            echo "✓ kokugo-kore-android-keystore-base64"
            rm /tmp/release_new.jks
          fi

          # Decode and upload Google Play SA JSON
          if [ ! -z "$PLAY_CONSOLE_SA_KEY_BASE64" ]; then
            echo "$PLAY_CONSOLE_SA_KEY_BASE64" | base64 -d > /tmp/play-sa.json
            gcloud secrets versions add kokugo-kore-play-console-sa-key \
              --data-file=/tmp/play-sa.json \
              --project=$GCP_PROJECT
            echo "✓ kokugo-kore-play-console-sa-key"
            rm /tmp/play-sa.json
          fi

      - name: Verify secrets created
        run: |
          echo "📋 Verifying secrets..."
          gcloud secrets list --filter="name:kokugo-kore*" --project=$GCP_PROJECT --format="value(name)"
