name: Deploy - Build & Upload

on:
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deploy type'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - release
          - debug

jobs:
  deploy:
    name: Deploy (${{ inputs.deploy_type }})
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Version management
      - name: Update version (Release/Internal)
        if: inputs.deploy_type != 'debug'
        run: |
          $pubspecPath = 'pubspec.yaml'
          $content = Get-Content $pubspecPath -Raw
          $versionMatch = [regex]::Match($content, 'version: (\d+\.\d+\.\d+)\+(\d+)')
          if ($versionMatch.Success) {
            $version = $versionMatch.Groups[1].Value
            $buildCode = [int]$versionMatch.Groups[2].Value + 1
            $newVersion = "$version+$buildCode"
            $content = $content -replace "version: $($versionMatch.Value)", "version: $newVersion"
            Set-Content $pubspecPath $content
            Write-Host "✓ Version updated to: $newVersion"
          }
        shell: powershell

      - name: Create keystore directory
        run: |
          if (!(Test-Path "android\keystore")) {
            New-Item -ItemType Directory -Path "android\keystore" -Force
          }
        shell: powershell

      - name: Decode and write keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ("${{ env.KEYSTORE_BASE64 }}" -ne "") {
            $bytes = [Convert]::FromBase64String("${{ env.KEYSTORE_BASE64 }}")
            [System.IO.File]::WriteAllBytes("android\keystore\release_new.jks", $bytes)
            Write-Host "✓ Keystore decoded"
          } else {
            Write-Host "⚠️ ANDROID_KEYSTORE_BASE64 not set"
          }
        shell: powershell

      - name: Map K: drive (Japanese path workaround)
        run: |
          $projectPath = "${{ github.workspace }}"
          subst K: $projectPath
          Write-Host "✓ K: drive mapped"
        shell: powershell

      # Build APK (Release)
      - name: Build APK (Release)
        if: inputs.deploy_type == 'release' || inputs.deploy_type == 'internal'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REVENUE_CAT_API_KEY: ${{ secrets.REVENUE_CAT_API_KEY }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          cd K:/
          flutter build apk --release --no-pub
          Write-Host "✓ Release APK built"
        shell: powershell

      # Build AAB (for Google Play)
      - name: Build AAB (Release)
        if: inputs.deploy_type == 'release' || inputs.deploy_type == 'internal'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REVENUE_CAT_API_KEY: ${{ secrets.REVENUE_CAT_API_KEY }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          cd K:/
          flutter build appbundle --release --no-pub
          Write-Host "✓ Release AAB built"
        shell: powershell

      # Build APK (Debug)
      - name: Build APK (Debug)
        if: inputs.deploy_type == 'debug'
        run: |
          cd K:/
          flutter build apk --debug
          Write-Host "✓ Debug APK built"
        shell: powershell

      # Google Play Upload (Internal Track)
      - name: Setup Ruby for fastlane
        if: inputs.deploy_type == 'internal'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: 'android'

      - name: Install fastlane
        if: inputs.deploy_type == 'internal'
        run: gem install fastlane -NV
        shell: pwsh

      - name: Upload to Google Play Internal Track
        if: inputs.deploy_type == 'internal'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if ("${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" -eq "") {
            Write-Host "⚠️ GOOGLE_PLAY_SERVICE_ACCOUNT_JSON not set"
            exit 0
          }

          $jsonPath = "android/fastlane/google_play_key.json"
          Set-Content -Path $jsonPath -Value "${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}"

          cd android
          fastlane android internal_track
          Remove-Item -Path "fastlane/google_play_key.json" -Force
          Write-Host "✓ Uploaded to internal track"
        shell: pwsh

      - name: Unmount K: drive
        if: always()
        run: |
          subst K: /d
          Write-Host "✓ K: drive unmounted"
        shell: powershell

      # Upload artifacts
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.deploy_type }}
          path: |
            build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30

      - name: Upload AAB artifact
        if: inputs.deploy_type == 'release' || inputs.deploy_type == 'internal'
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ inputs.deploy_type }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Commit version update
      - name: Commit version update
        if: inputs.deploy_type != 'debug'
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add pubspec.yaml
          git commit -m "chore: update build version [skip ci]" || echo "No changes to commit"
        shell: bash

      - name: Push version update
        if: inputs.deploy_type != 'debug'
        run: git push origin HEAD:main
        shell: bash
