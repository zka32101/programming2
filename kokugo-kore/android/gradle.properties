org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
android.overridePathCheck=true
android.useAndroidX=true
# Disable Kotlin incremental compilation: causes "different roots" errors
# when building from a subst virtual drive (K:) vs pub cache on C:
kotlin.incremental=false
kotlin.incremental.android=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
android.enableR8.fullMode=true
